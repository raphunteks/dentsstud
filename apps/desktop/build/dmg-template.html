<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 660px;
      height: 440px;
      background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 52%, #EEF2FF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Subtle architectural dot grid */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(91, 75, 255, 0.12) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.65;
    }

    /* Soft ambient brand glow matching dentsweb-logo.svg gradient */
    .glow-left {
      position: absolute;
      width: 280px;
      height: 280px;
      top: -90px;
      left: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 43, 255, 0.16) 0%, rgba(91, 75, 255, 0.06) 55%, transparent 75%);
    }
    .glow-right {
      position: absolute;
      width: 320px;
      height: 320px;
      bottom: -110px;
      right: -80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 194, 255, 0.18) 0%, rgba(91, 75, 255, 0.07) 55%, transparent 75%);
    }

    /* Top brand bar */
    .brand-header {
      position: absolute;
      top: 26px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #0F172A;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #64748B;
    }

    /* Subtle bottom caption */
    .footer-caption {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #64748B;
    }

    /* Full-bleed SVG vector overlay */
    .vector-layer {
      position: absolute;
      inset: 0;
      width: 660px;
      height: 440px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="brand-header">
    <div class="brand-title">DENTSWEB STUDIO</div>
    <div class="brand-sub">Seret aplikasi ke folder Applications untuk memasang</div>
  </div>

  <!-- Clean circuit accents & gradient arrow between App (180,220) and Applications (480,220) -->
  <svg class="vector-layer" viewBox="0 0 660 440" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dw-arrow" x1="252" y1="210" x2="408" y2="210" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#D92BFF"/>
        <stop offset="50%" stop-color="#5B4BFF"/>
        <stop offset="100%" stop-color="#00C2FF"/>
      </linearGradient>
      <linearGradient id="dw-trace" x1="0" y1="0" x2="660" y2="440" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#D92BFF" stop-opacity="0.28"/>
        <stop offset="50%" stop-color="#5B4BFF" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.28"/>
      </linearGradient>
    </defs>

    <!-- Subtle top-left & bottom-right geometric circuit traces -->
    <path d="M28 72 H88 L112 96" stroke="url(#dw-trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="116" cy="100" r="4.5" stroke="#5B4BFF" stroke-opacity="0.35" stroke-width="2"/>

    <path d="M632 368 H568 L544 344" stroke="url(#dw-trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="540" cy="340" r="4.5" stroke="#00C2FF" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Subtle circular drop zone guides behind App (180,215) & Applications (480,215) -->
    <rect x="116" y="146" width="128" height="128" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#E2E8F0" stroke-width="1.25"/>
    <rect x="416" y="146" width="128" height="128" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#E2E8F0" stroke-width="1.25" stroke-dasharray="5 5"/>

    <!-- Crisp gradient curved drag arrow -->
    <circle cx="262" cy="210" r="4" fill="#D92BFF"/>
    <path d="M266 210 C306 184 352 184 394 210" stroke="url(#dw-arrow)" stroke-width="2.75" stroke-linecap="round"/>
    <path d="M385 201 L397 211 L383 217" stroke="#00C2FF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="footer-caption">Create Motion. Powered by DENTSWEB STUDIO</div>
</body>
</html>
