appId: studio.dentsweb.desktop
productName: DENTSWEB STUDIO
copyright: DENTSWEB STUDIO — lisensi nonkomersial
directories:
  output: release/${version}
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/node_modules/@remotion/**"
  - "dist/remotion-bundle/**"
protocols:
  - name: DENTSWEB STUDIO
    schemes: [dentsweb, dentweb]
afterSign: scripts/after-sign-mac.mjs
mac:
  category: public.app-category.video
  minimumSystemVersion: "13.0"
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSMinimumSystemVersion: "13.0"
    NSLocalNetworkUsageDescription: "DENTSWEB STUDIO membutuhkan akses jaringan lokal untuk callback login OAuth dan pratinjau render lokal."
    NSDocumentsFolderUsageDescription: "DENTSWEB STUDIO membutuhkan akses folder Dokumen untuk menyimpan proyek dan aset video Anda."
    NSDownloadsFolderUsageDescription: "DENTSWEB STUDIO membutuhkan akses folder Unduhan untuk menyimpan hasil render MP4 dan pembaruan aplikasi."
    NSHighResolutionCapable: true
    NSSupportsAutomaticGraphicsSwitching: true
  # Signing + notarization: set CSC_LINK/CSC_KEY_PASSWORD and APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID.
  notarize: false
dmg:
  artifactName: DENTSWEB-STUDIO-${version}-${arch}.dmg
  format: UDZO
  internetEnabled: false
  background: build/background.tiff
  iconSize: 128
  window:
    width: 660
    height: 440
  contents:
    - x: 180
      y: 220
      type: file
    - x: 480
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: DENTSWEB-STUDIO-Setup-${version}.${ext}
  # Signing: set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target: [dir]
publish: null
